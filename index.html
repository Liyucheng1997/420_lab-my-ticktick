<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>我的滴答清单</title>
  <meta name="theme-color" content="#f5f5f7">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230071e3'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // 提前应用主题，避免闪烁
    try {
      var s = JSON.parse(localStorage.getItem('mytick.data.v1') || 'null');
      var th = (s && s.settings && s.settings.theme) || 'light';
      if (th === 'auto') th = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = th;
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app">
    <nav class="rail" id="rail"></nav>
    <main class="view" id="view"></main>
  </div>
  <div class="toast-host" id="toasts"></div>

  <script src="js/util.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/store.js"></script>
  <script src="js/parse.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/detail.js"></script>
  <script src="js/view-tasks.js"></script>
  <script src="js/view-calendar.js"></script>
  <script src="js/view-matrix.js"></script>
  <script src="js/view-pomo.js"></script>
  <script src="js/view-habits.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
